[project]
name = "radar"
version = "0.1.0"
description = "Opportunity & Deadline Radar"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2",
    "sqlalchemy>=2,<3",
]

[dependency-groups]
dev = [
    "pytest",
    "respx>=0.23.1",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
